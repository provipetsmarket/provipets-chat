<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <base target="_blank">
  <style>
    *{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#163c38;background:#f4f8f7}
    .app{height:100vh;height:100dvh;max-width:820px;margin:auto;display:flex;flex-direction:column;background:white}
    header{background:#086f62;color:white;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    h1{font-size:18px;margin:0}header p{margin:2px 0 0;font-size:13px;color:#d6eeea}
    button,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:#086f62;color:white}
    header button{background:#ffffff20;border:1px solid #ffffff60;font-size:13px;white-space:nowrap}
    button:disabled{opacity:.55;cursor:wait}button:focus-visible,textarea:focus-visible{outline:3px solid #e9b44c;outline-offset:2px}
    #messages{flex:1;overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
    .message{max-width:90%;padding:13px 16px;border-radius:16px;background:#edf5f2;white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}
    .user{background:#086f62;color:white;align-self:flex-end}.error{background:#fff1df;color:#75460a}.message a{color:inherit;text-decoration:underline}
    #status{min-height:24px;padding:0 20px;color:#496b64;font-size:13px}form{display:flex;gap:10px;padding:12px 16px 18px;border-top:1px solid #e2ebe7;align-items:flex-end}
    textarea{flex:1;min-width:0;resize:none;border:1px solid #b8cfc7;border-radius:12px;padding:11px 12px;min-height:48px;max-height:130px;color:#163c38;background:white}
    @media(max-width:420px){header{padding:14px 12px}h1{font-size:16px}#messages{padding:16px 12px}.message{max-width:95%}form{padding:10px 12px 14px}button{padding:11px 12px}}
  </style>
</head>
<body>
<main class="app">
  <header><div><h1>Provipets Market</h1><p>Tu asistente de compras</p></div><button type="button" id="reset">Nuevo chat</button></header>
  <div id="messages" role="log" aria-label="Conversación" aria-live="polite"></div>
  <div id="status" role="status"></div>
  <form id="form"><textarea id="input" rows="2" maxlength="2000" aria-label="Tu mensaje" placeholder="¿Qué producto estás buscando?" required></textarea><button id="send" type="submit">Enviar</button></form>
</main>
<script>
  (() => {
    'use strict';
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    const send = document.getElementById('send');
    const reset = document.getElementById('reset');
    let token = null, busy = false;

    // Build nodes, never interpret model/customer text as HTML.
    function add(text, role) {
      const bubble = document.createElement('div');
      bubble.className = 'message ' + (role || '');
      const links = /\[([^\]\n]+)\]\((https:\/\/[^\s)]+)\)|(https:\/\/[^\s<>]+)/g;
      let start = 0;
      for (const match of text.matchAll(links)) {
        bubble.append(document.createTextNode(text.slice(start, match.index)));
        let url = match[2] || match[3];
        let suffix = '';
        if (!match[2]) { const tail = url.match(/[.,;!?)]+$/); if (tail) { suffix = tail[0]; url = url.slice(0,-suffix.length); } }
        const anchor = document.createElement('a');
        anchor.textContent = match[1] || url;
        anchor.href = url; anchor.target = '_blank'; anchor.rel = 'noopener noreferrer';
        bubble.append(anchor,document.createTextNode(suffix));
        start = match.index + match[0].length;
      }
      bubble.append(document.createTextNode(text.slice(start)));
      messages.append(bubble); messages.scrollTop = messages.scrollHeight;
    }
    function setBusy(value) { busy = value; send.disabled = value; reset.disabled = value; input.disabled = value; status.textContent = value ? 'Consultando, espera un momento…' : ''; }
    function fresh() { token = null; messages.replaceChildren(); add('¡Hola! Soy el asistente de Provipets Market. ¿Qué producto estás buscando?'); input.value = ''; status.textContent = ''; input.focus(); }
    reset.addEventListener('click',fresh);
    document.getElementById('form').addEventListener('submit',event => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || busy) return;
      const bytes = new Uint8Array(16); crypto.getRandomValues(bytes);
      const requestId = Array.from(bytes,b => b.toString(16).padStart(2,'0')).join('');
      add(message,'user'); input.value = ''; setBusy(true);
      google.script.run.withSuccessHandler(result => {
        setBusy(false);
        if (result && result.token) token = result.token;
        if (result && typeof result.text === 'string') add(result.text,result.ok ? '' : 'error');
        else add('No pude completar la consulta. Inténtalo nuevamente.','error');
        if (result && result.ok && result.remaining === 0) status.textContent = 'Llegaste a 20 consultas. Pulsa Nuevo chat para continuar.';
        input.focus();
      }).withFailureHandler(() => {
        setBusy(false); add('No pude conectar con el chat. Espera un momento y vuelve a consultar.','error'); input.focus();
      }).chat(message,token,requestId);
    });
    input.addEventListener('keydown',event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); document.getElementById('form').requestSubmit(); } });
    fresh();
  })();
</script>
</body>
</html>
