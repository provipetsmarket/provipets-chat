<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente Provipets Market</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#183237;background:#fff}main{height:100dvh;display:flex;flex-direction:column;max-width:700px;margin:auto}header{background:#086f72;color:white;padding:20px;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}small{display:block;margin-top:5px;opacity:.85}header button{background:transparent;border:1px solid #ffffff80;color:#fff;border-radius:9px;padding:8px;cursor:pointer}#messages{flex:1;overflow:auto;padding:20px;background:#f5f8f8}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #e1eaea;border-radius:14px;padding:13px 15px;margin-bottom:12px;max-width:92%;line-height:1.5}.user{background:#d9f1eb;margin-left:auto}.error{color:#a32a2a}a{color:#086f72}form{display:flex;padding:14px;gap:8px;border-top:1px solid #e1eaea}input{min-width:0;flex:1;border:1px solid #ccd9d9;border-radius:12px;padding:13px;font:inherit}form button{border:0;background:#086f72;color:white;padding:0 18px;border-radius:12px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{font-size:12px;padding:0 16px 8px;color:#567}
</style>
<main><header><div><h1>Provipets Market</h1><small>Asistente de compras · IA</small></div><button id="reset" aria-label="Nueva conversación">Nuevo chat</button></header><div id="messages" role="log" aria-live="polite"></div><form><input aria-label="Tu consulta" placeholder="¿Qué producto estás buscando?" maxlength="2000" required autocomplete="off"><button>Enviar</button></form><div id="status" role="status"></div></main>
<script>
const messages=document.querySelector('#messages'),form=document.querySelector('form'),input=document.querySelector('input'),send=form.querySelector('button'),status=document.querySelector('#status'),reset=document.querySelector('#reset');let token=null;
function bubble(text,kind=''){const el=document.createElement('div');el.className='bubble '+kind;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el;}
function greeting(){bubble('¡Hola! Soy el asistente de Provipets Market. ¿Qué producto estás buscando?');}greeting();
reset.onclick=()=>{messages.replaceChildren();token=null;greeting();status.textContent='';};
function linkify(el,text){el.replaceChildren();let pos=0;const re=/https:\/\/[^\s<>"\]]+/g;for(const m of text.matchAll(re)){el.append(document.createTextNode(text.slice(pos,m.index)));const a=document.createElement('a');a.href=m[0].replace(/[).,;]+$/,'');a.textContent=a.href;a.target='_blank';a.rel='noopener noreferrer';el.append(a);pos=m.index+m[0].length;}el.append(document.createTextNode(text.slice(pos)));}
form.onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;bubble(message,'user');input.value='';send.disabled=true;reset.disabled=true;const answer=bubble('');const parts=new Map();status.textContent='Consultando…';let complete=false;
try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,token})});if(!response.ok){const err=await response.json();throw Error(err.error||'No se pudo conectar.');}const reader=response.body.getReader(),decoder=new TextDecoder();let pending='';
while(true){const {value,done}=await reader.read();pending+=decoder.decode(value||new Uint8Array(),{stream:!done});let cut;while((cut=pending.indexOf('\n'))>=0){const line=pending.slice(0,cut);pending=pending.slice(cut+1);if(!line.trim())continue;const event=JSON.parse(line);if(event.type==='session'){token=event.token;continue;}if(event.type==='error')throw Error(event.text);if(event.type==='complete'){complete=true;status.textContent='';}else if(event.type==='status')status.textContent=event.text;else{const key=[event.item_id,event.output_index,event.content_index].join(':');parts.set(key,event.type.endsWith('.done')?event.text:(parts.get(key)||'')+(event.delta||''));linkify(answer,[...parts.values()].join('\n\n'));messages.scrollTop=messages.scrollHeight;}}if(done)break;}
if(!complete)throw Error('La conexión se interrumpió. Inicia un chat nuevo antes de volver a enviar.');if(!answer.textContent)answer.textContent='No recibí una respuesta de texto. Inténtalo de nuevo.';
}catch(error){answer.classList.add('error');answer.textContent+=(answer.textContent?'\n\n':'')+error.message;status.textContent='';}finally{send.disabled=false;reset.disabled=false;input.focus();}};
</script></html>
